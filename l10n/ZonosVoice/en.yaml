pageName: "ZonosVoice"
pageDescription: "Speaks NPC dialogue with voices that the Zonos TTS server makes while you play. The voice daemon (zonosvoice.py run) must be running."
groupName: "Dialogue voices"
enabledName: "Speak dialogue"
enabledDescription: "Send greetings, topic answers and persuasion answers to the voice daemon and play the result on the NPC."
stopOnCloseName: "Stop when the dialogue window closes"
stopOnCloseDescription: "Stop the NPC's line when you leave the conversation. Turn off to let the NPC finish the line."
readBooksName: "Read books aloud"
readBooksDescription: "A narrator voice reads a book or scroll when you open it. The reading stops when you close it."
